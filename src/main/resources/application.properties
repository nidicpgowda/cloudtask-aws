spring.application.name=cloudtask

server.port=8081

# Database configuration will be added when Oracle is ready
# Oracle Database
spring.datasource.url=jdbc:oracle:thin:@//localhost:1522/CLOUDTASKPDB
spring.datasource.username=CLOUDTASK
spring.datasource.password=${CLOUDTASK_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always