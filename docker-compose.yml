services:
  oracle:
    image: container-registry.oracle.com/database/free:latest
    container_name: cloudtask-oracle
    runtime: runc
    environment:
      ORACLE_PWD: ${ORACLE_PWD}
    ports:
      - "1522:1521"
    volumes:
      - cloudtask_oracle_data:/opt/oracle/oradata
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudtask-app
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CLOUDTASK_DB_PASSWORD: ${CLOUDTASK_DB_PASSWORD}
    depends_on:
      - oracle
    restart: unless-stopped

volumes:
  cloudtask_oracle_data: